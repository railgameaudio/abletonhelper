[project]
name = "abletonhelper"
version = "0.1.0"
description = "Analyse song stems and build Ableton Live sets from them"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    # Verified against 0.11.0 and 1.0.0. Note 1.0.0 requires Python >=3.12.
    "librosa>=0.11,<2",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Functional section labels. Large: pulls torch + natten + demucs.
allin1 = ["allin1>=1.1.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
abletonhelper = "abletonhelper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
